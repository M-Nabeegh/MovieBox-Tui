name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-hygiene"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Audit dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: Verify package
        run: cargo package --locked

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-build-test-${{ matrix.os }}"
      - run: cargo build --locked
      - run: cargo test --locked

  server-all-features:
    name: Server tests (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-server"
      - run: cargo test --all-features --locked

  web:
    name: Web typecheck, unit, build, and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  deployment-policy:
    name: Compose and private-shell policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install policy test tools
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - run: docker compose -f deploy/compose/compose.yml --env-file deploy/compose/.env.example config --quiet
      - run: bats tests/compose.bats tests/tailscale_serve.bats
      - run: shellcheck deploy/tailscale/moviebox-serve.sh
      - name: Audit Rust dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: npm audit --prefix web --audit-level=high
