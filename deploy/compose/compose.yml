services:
  moviebox-server:
    build:
      context: ../..
      dockerfile: docker/server.Dockerfile
      args:
        APP_UID: "${MOVIEBOX_UID}"
        APP_GID: "${MOVIEBOX_GID}"
    image: moviebox-server:local
    user: "${MOVIEBOX_UID}:${MOVIEBOX_GID}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8420:8420"
    environment:
      MOVIEBOX_BIND: "${MOVIEBOX_BIND}"
      MOVIEBOX_DATABASE_URL: sqlite:///config/moviebox.db
      MOVIEBOX_MEDIA_ROOT: /media
      MOVIEBOX_PARTIAL_ROOT: /partials
      MOVIEBOX_CONFIG_ROOT: /config
      MOVIEBOX_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      MOVIEBOX_SESSION_KEY_FILE: /run/secrets/session_key
      MOVIEBOX_MAX_HEIGHT: "${MOVIEBOX_MAX_HEIGHT}"
      MOVIEBOX_DOWNLOAD_CONCURRENCY: "${MOVIEBOX_DOWNLOAD_CONCURRENCY}"
      MOVIEBOX_RESERVE_GIB: "${MOVIEBOX_RESERVE_GIB}"
      MOVIEBOX_JELLYFIN_BASE_URL: http://jellyfin:8096
      MOVIEBOX_LOG_FORMAT: text
    volumes:
      - "${MOVIEBOX_DATA_ROOT}/config/server:/config"
      - "${MOVIEBOX_DATA_ROOT}/partials:/partials"
      - "${MOVIEBOX_DATA_ROOT}/media:/media"
    secrets:
      - admin_password
      - session_key
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8420/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      jellyfin:
        condition: service_healthy

  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    user: "${MOVIEBOX_UID}:${MOVIEBOX_GID}"
    group_add:
      - "${JELLYFIN_RENDER_GID}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${JELLYFIN_PUBLISHED_PORT}:8096"
    volumes:
      - "${MOVIEBOX_DATA_ROOT}/config/jellyfin:/config"
      - "${MOVIEBOX_DATA_ROOT}/cache/jellyfin:/cache"
      - "${MOVIEBOX_DATA_ROOT}/media:/media:ro"
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

secrets:
  admin_password:
    file: ./secrets/admin_password.txt
  session_key:
    file: ./secrets/session_key.txt
