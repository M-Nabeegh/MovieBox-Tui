[package]
name = "moviebox-tui"
exclude = [
    "assets/",
    ".github/",
    ".githooks/",
    "Formula/",
    "install.sh",
    "install.ps1",
]
version = "0.1.11"
edition = "2024"
description = "A terminal client for finding and streaming movies, TV shows, and anime from the MovieBox catalog."
repository = "https://github.com/mesamirh/MovieBox-Tui"
homepage = "https://github.com/mesamirh/MovieBox-Tui"
license = "MIT OR Apache-2.0"
keywords = ["tui", "moviebox", "streaming", "movies", "cli"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
rust-version = "1.90.0"

[dependencies]
base64 = "0.23.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.18.1"
md-5 = "0.11.0"
rand = "0.10.2"
quick-xml = "0.42.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
scraper = "0.27.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
url = "2.5.8"
unicode-segmentation = "1.12.0"
unicode-normalization = { version = "0.1.25", optional = true }
unicode-width = "0.2.0"
open = "5.4.0"
percent-encoding = "2.3.2"
log = "0.4.33"
flexi_logger = "0.31.10"
argon2 = { version = "0.5.3", optional = true }
async-stream = { version = "0.3.6", optional = true }
async-trait = { version = "0.1.89", optional = true }
axum = { version = "0.8.6", optional = true }
cookie = { version = "0.18.1", optional = true }
mime_guess = { version = "2.0.5", optional = true }
rust-embed = { version = "8.8.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"], optional = true }
time = { version = "0.3.55", optional = true }
tokio-stream = { version = "0.1.17", optional = true }
tokio-util = { version = "0.7.17", features = ["rt"], optional = true }
tower-http = { version = "0.6.11", optional = true }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.18.1", features = ["v4"], optional = true }
libc = { version = "0.2.177", optional = true }

[features]
server = [
    "dep:argon2",
    "dep:async-stream",
    "dep:async-trait",
    "dep:axum",
    "dep:cookie",
    "dep:mime_guess",
    "dep:rust-embed",
    "dep:sha2",
    "dep:sqlx",
    "dep:time",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:unicode-normalization",
    "dep:uuid",
    "dep:libc",
]

[lib]
name = "moviebox_tui"
path = "src/lib.rs"

[[bin]]
name = "moviebox-server"
path = "src/bin/moviebox-server.rs"
required-features = ["server"]

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
nonminimal_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true


[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
mimalloc = "0.1.52"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "hickory-dns"] }

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.23.0"
# `test-util` provides the paused clock used to assert the worker idles cheaply.
tokio = { version = "1.52.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
